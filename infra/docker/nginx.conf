events {}

http {
  resolver 127.0.0.11 ipv6=off;

  upstream web {
    server web:3000;
  }

  upstream auth {
    server auth:4100;
  }

  upstream service {
    server service:4000;
  }

  map $http_accept $admin_usage_upstream {
    default http://service;
    ~*text/html http://web;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /auth/ {
      proxy_pass http://auth;
    }

    location = /health {
      proxy_pass http://service;
    }

    location ^~ /admin/model- {
      proxy_pass http://service;
    }

    location ^~ /admin/usage {
      proxy_pass $admin_usage_upstream;
    }

    location ^~ /workspaces {
      proxy_pass http://service;
    }

    location ^~ /ai/ {
      proxy_pass http://service;
    }

    location ^~ /agent-runs {
      proxy_pass http://service;
    }

    location ^~ /upload-sessions {
      proxy_pass http://service;
    }

    location ^~ /resources {
      proxy_pass http://service;
    }

    location ^~ /conversations {
      proxy_pass http://service;
    }

    location ^~ /runs {
      proxy_pass http://service;
    }

    location ^~ /artifacts {
      proxy_pass http://service;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
