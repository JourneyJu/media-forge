events {}

http {
  resolver 127.0.0.11 ipv6=off;

  map $http_accept $admin_usage_upstream {
    default http://service:4000;
    ~*text/html http://web:3000;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /auth/ {
      set $auth_upstream http://auth:4100;
      proxy_pass $auth_upstream;
    }

    location = /health {
      set $service_upstream http://service:4000;
      proxy_pass $service_upstream;
    }

    location ^~ /admin/model- {
      set $service_upstream http://service:4000;
      proxy_pass $service_upstream;
    }

    location ^~ /admin/usage {
      proxy_pass $admin_usage_upstream;
    }

    location ^~ /workspaces {
      set $service_upstream http://service:4000;
      proxy_pass $service_upstream;
    }

    location ^~ /ai/ {
      set $service_upstream http://service:4000;
      proxy_pass $service_upstream;
    }

    location ^~ /agent-runs {
      set $service_upstream http://service:4000;
      proxy_pass $service_upstream;
    }

    location ^~ /upload-sessions {
      set $service_upstream http://service:4000;
      proxy_pass $service_upstream;
    }

    location ^~ /resources {
      set $service_upstream http://service:4000;
      proxy_pass $service_upstream;
    }

    location ^~ /conversations {
      set $service_upstream http://service:4000;
      proxy_pass $service_upstream;
    }

    location ^~ /runs {
      set $service_upstream http://service:4000;
      proxy_pass $service_upstream;
    }

    location ^~ /artifacts {
      set $service_upstream http://service:4000;
      proxy_pass $service_upstream;
    }

    location / {
      set $web_upstream http://web:3000;
      proxy_pass $web_upstream;
    }
  }
}
