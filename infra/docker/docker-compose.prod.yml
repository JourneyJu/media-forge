name: mediaforge-prod

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: mediaforge-nginx
    restart: unless-stopped
    depends_on:
      - web
      - auth
      - service
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        PACKAGE_FILTER: "@mediaforge/web"
        NEXT_PUBLIC_AUTH_URL: ${PUBLIC_ORIGIN}
        NEXT_PUBLIC_SERVICE_URL: ${PUBLIC_ORIGIN}
    container_name: mediaforge-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    command: ["pnpm", "--filter", "@mediaforge/web", "start"]
    expose:
      - "3000"

  auth:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        PACKAGE_FILTER: "@mediaforge/auth"
    container_name: mediaforge-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WEB_ORIGIN: ${PUBLIC_ORIGIN}
      AUTH_JWT_ISSUER: ${PUBLIC_ORIGIN}
      AUTH_JWT_AUDIENCE: mediaforge-service
      AUTH_BOOTSTRAP_ADMIN_ACCOUNT: ${AUTH_BOOTSTRAP_ADMIN_ACCOUNT}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD}
      AUTH_JWT_PRIVATE_KEY_PEM: ${AUTH_JWT_PRIVATE_KEY_PEM}
      AUTH_PASSWORD_PRIVATE_KEY_PEM: ${AUTH_PASSWORD_PRIVATE_KEY_PEM}
    command: ["pnpm", "--filter", "@mediaforge/auth", "start"]
    expose:
      - "4100"

  service:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        PACKAGE_FILTER: "@mediaforge/service"
    container_name: mediaforge-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${PUBLIC_ORIGIN}
      AUTH_JWKS_URL: http://auth:4100/auth/jwks.json
      AUTH_JWT_ISSUER: ${PUBLIC_ORIGIN}
      AUTH_JWT_AUDIENCE: mediaforge-service
      AUTH_SESSION_VALIDATE_URL: http://auth:4100/auth/session/validate
      S3_ENDPOINT: http://minio:9000
      S3_REGION: local
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      MODEL_MODE: ${MODEL_MODE:-demo}
    command: ["pnpm", "--filter", "@mediaforge/service", "start"]
    expose:
      - "4000"

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        PACKAGE_FILTER: "@mediaforge/worker"
    container_name: mediaforge-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: local
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      MODEL_MODE: ${MODEL_MODE:-demo}
      CREATION_RUN_WORKER_CONCURRENCY: ${CREATION_RUN_WORKER_CONCURRENCY:-2}
    command: ["pnpm", "--filter", "@mediaforge/worker", "start"]

  postgres:
    image: postgres:16-alpine
    container_name: mediaforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mediaforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: mediaforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"

  create-bucket:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: mediaforge-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      mc anonymous set none local/$$S3_BUCKET;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}

volumes:
  postgres-data:
  redis-data:
  minio-data:
